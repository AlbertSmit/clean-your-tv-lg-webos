name: cytv standalone builds
on:
  workflow_dispatch:
  push:
    paths:
      - 'cytv/**'
      - 'scripts/build-cytv.py'
      - 'scripts/desktop_packaging.py'
      - 'tests/cytv/**'
      - 'launcher/**'
      - 'native/**'
      - 'root-edition/**'
      - 'renewal-service/**'
      - 'lgtv.py'
      - 'release-versions.json'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/cytv.yml'
  pull_request:
    paths:
      - 'cytv/**'
      - 'scripts/build-cytv.py'
      - 'scripts/desktop_packaging.py'
      - 'tests/cytv/**'
      - 'launcher/**'
      - 'native/**'
      - 'root-edition/**'
      - 'renewal-service/**'
      - 'lgtv.py'
      - 'release-versions.json'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/cytv.yml'
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: cytv-windows-x64
            binary: dist/cytv.exe
          - os: ubuntu-22.04
            asset: cytv-linux-x64
            binary: dist/cytv
          - os: macos-15
            asset: cytv-macos-arm64
            binary: dist/cytv
          - os: macos-15-intel
            asset: cytv-macos-x64
            binary: dist/cytv
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-render-util0 xvfb xauth
      - run: python -m pip install -r cytv/build-requirements.txt
      - run: python -m unittest discover -s tests/cytv -v
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python scripts/build-cytv.py --desktop
      - name: Verify installed Linux desktop package
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./dist/cytv-linux-x64.deb
          xvfb-run -a env QT_QPA_PLATFORM=xcb /opt/clean-your-tv/cytv-desktop --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: runner.os != 'Windows'
        with:
          name: ${{ matrix.asset }}-desktop
          path: |
            dist/cytv-macos-*.zip
            dist/cytv-linux-x64.deb
          if-no-files-found: error
