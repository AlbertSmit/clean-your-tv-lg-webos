name: Tests
on:
  push:
  pull_request:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python -m pip install -r cytv/requirements.txt
      - run: scripts/test.sh
      - name: Check compiled Home with legacy browser limitations
        if: runner.os == 'Linux'
        run: |
          npx playwright install --with-deps chromium
          python scripts/tv_web_build.py --input launcher --output build/legacy-ui
          BROWSER_CHANNEL=chromium TV_WEB_DIR=build/legacy-ui npm run test:legacy-ui
      - name: Verify real webOS-style file ownership
        if: runner.os == 'Linux'
        run: sudo "$(command -v node)" native/prototype/test-state-permissions-linux.cjs
