name: Release PR policy
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read
  statuses: write
env:
  POLICY_CONTEXT: ${{ github.event.pull_request.base.ref == 'main' && 'Release policy' || 'Integration policy' }}
concurrency:
  group: release-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  policy:
    name: Validate release PR
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Mark release policy pending on the PR head
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: context.payload.pull_request.head.sha,
              context: process.env.POLICY_CONTEXT, state: 'pending',
              description: 'Validating release routing and candidate',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
      - uses: actions/checkout@v4
        with:
          # Always run policy from trusted main, never execute candidate code.
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch PR objects as data without checking out or executing them
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "refs/pull/$PR_NUMBER/head"
      - name: Check branch, finalized metadata, complete scope and candidate builds
        id: validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release-flow.py check
      - name: Report trusted policy result on the exact PR head
        if: always() && !cancelled()
        uses: actions/github-script@v7
        env:
          POLICY_OUTCOME: ${{ steps.validation.outcome }}
        with:
          script: |
            const ok = process.env.POLICY_OUTCOME === 'success';
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: context.payload.pull_request.head.sha,
              context: process.env.POLICY_CONTEXT, state: ok ? 'success' : 'failure',
              description: ok ? 'Release policy passed' : 'Release policy failed; see workflow logs',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
