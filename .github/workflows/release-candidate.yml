name: Maintain next release candidate
on:
  push:
    branches: [release/next]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: next-release-candidate
  cancel-in-progress: false
jobs:
  candidate:
    if: github.ref == 'refs/heads/release/next'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Open a draft unless the current candidate already exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release-flow.py ensure-candidate
