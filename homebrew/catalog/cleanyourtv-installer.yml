description: |
  **Review draft: this Homebrew installation path is not released or TV-accepted.**

  CYTV Installer installs and maintains the Root edition of Clean Your TV from
  the TV. It is a separate installer application, not the CYTV launcher or a
  replacement for its update services. The desktop/console cytv installer remains
  available, including its separate No-root flow.

  ### Prerequisites

  A rooted LG webOS TV with Homebrew Channel and its execution service is required.
  Root execution must actually be available; installing Homebrew Channel alone
  does not prove that. The installer checks Node.js 8+, ARM ABI, component and
  recovery state, and free storage before setup. The bundled private Python 3.13
  runtime is for compatible ARMv7 TVs; a usable system Python must be 3.9+.
  Runtime preparation requires at least 320 MiB free; package-manager staging and
  total device storage limits still require physical measurement. This package
  includes a large offline runtime (current development IPK about 57 MiB).
  No model, firmware or webOS version is certified by this draft. The installer
  does not root the TV or make unsupported hardware compatible.

  ### Installation, updates and removal

  Review prerequisites and product versions, explicitly prepare Python if needed,
  then confirm installation. Root Home and Root Updater are separate product
  components. System Updater preparation is a separate explicit choice. Home
  activation is also separate and preserves the emergency-stop latch.

  Homebrew Channel updates **CYTV Installer only**. The CYTV System Updater owns
  complete product updates. Installer version numbers are independent from Root,
  Root Updater and System Updater versions. Existing installations are inspected
  before maintenance; incomplete or unknown state offers recovery or diagnosis.

  Removing CYTV Installer removes only the installer application. Use its explicit
  complete-product removal action (or cytv) to remove the separately installed
  product. Direct component removal safety, triple-Home emergency release,
  standby and separate cold boot are mandatory pending physical tests.

  ### Source, licenses and support

  [Source code](https://github.com/Razdva122/clean-your-tv-lg-webos),
  [MIT license](https://github.com/Razdva122/clean-your-tv-lg-webos/blob/main/LICENSE),
  [third-party notices](https://github.com/Razdva122/clean-your-tv-lg-webos/blob/main/THIRD_PARTY_NOTICES.md),
  [runtime provenance and packaging](https://github.com/Razdva122/clean-your-tv-lg-webos/blob/main/homebrew/README.md),
  [support](https://github.com/Razdva122/clean-your-tv-lg-webos/issues).
  The private CPython runtime is pinned and authenticated before normalization;
  its Python-2.0 and component license files are included in the offline payload.
  Bundled Noto fonts include their OFL licenses.

