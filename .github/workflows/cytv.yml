name: cytv standalone builds
on:
  workflow_dispatch:
  push:
    paths:
      - 'cytv/**'
      - 'android/**'
      - 'assets/brand/**'
      - 'assets/icons/**'
      - 'scripts/build-cytv.py'
      - 'scripts/desktop_packaging.py'
      - 'tests/cytv/**'
      - 'launcher/**'
      - 'native/**'
      - 'root-edition/**'
      - 'renewal-service/**'
      - 'lgtv.py'
      - 'release-versions.json'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/cytv.yml'
  pull_request:
    paths:
      - 'cytv/**'
      - 'android/**'
      - 'assets/brand/**'
      - 'assets/icons/**'
      - 'scripts/build-cytv.py'
      - 'scripts/desktop_packaging.py'
      - 'tests/cytv/**'
      - 'launcher/**'
      - 'native/**'
      - 'root-edition/**'
      - 'renewal-service/**'
      - 'lgtv.py'
      - 'release-versions.json'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/cytv.yml'
permissions:
  contents: read
jobs:
  android:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK and payload builder
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          python -m pip install -r cytv/requirements.txt ziglang==0.14.1
          python scripts/build-cytv.py --payload-only
          python -m unittest discover -s android/tests
      - name: Restore the persistent preview signer
        env:
          CYTV_PREVIEW_KEYSTORE: ${{ secrets.CYTV_ANDROID_PREVIEW_KEYSTORE_B64 }}
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          value = os.environ.get('CYTV_PREVIEW_KEYSTORE', '')
          if not value:
              raise SystemExit('Persistent Android preview signing secret is required')
          path = Path(os.environ['RUNNER_TEMP']) / 'android-preview.keystore'
          path.write_bytes(base64.b64decode(value, validate=True))
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('CYTV_ANDROID_KEYSTORE=' + str(path) + '\n')
          PY
      - name: Build and verify the Android preview
        run: |
          export CYTV_BUILD_PYTHON="$(command -v python)"
          android/gradlew -p android :app:assembleDebug :app:lintDebug --no-daemon
          mkdir -p dist/android
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/android/cytv-android-arm64.apk
          python android/verify_release.py dist/android/cytv-android-arm64.apk --output dist/android/cytv-android-arm64.build.json
      - name: Remove the signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/android-preview.keystore"
      - uses: actions/upload-artifact@v4
        with:
          name: cytv-android-arm64
          path: dist/android/cytv-android-arm64*
          if-no-files-found: error
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: cytv-windows-x64
            binary: dist/cytv.exe
          - os: ubuntu-22.04
            asset: cytv-linux-x64
            binary: dist/cytv
          - os: macos-15
            asset: cytv-macos-arm64
            binary: dist/cytv
          - os: macos-15-intel
            asset: cytv-macos-x64
            binary: dist/cytv
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-render-util0 xvfb xauth
      - run: python -m pip install -r cytv/build-requirements.txt
      - run: python -m unittest discover -s tests/cytv -v
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python scripts/build-cytv.py --desktop
      - name: Verify installed Linux desktop package
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./dist/cytv-linux-x64.deb
          xvfb-run -a env QT_QPA_PLATFORM=xcb /opt/clean-your-tv/cytv-desktop --smoke-test
      - name: Verify extracted Windows desktop package
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 3
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'cytv-desktop-smoke'
          Expand-Archive -LiteralPath dist/cytv-windows-x64-desktop.zip -DestinationPath $destination
          $exe = Join-Path $destination 'cytv-desktop/cytv-desktop.exe'
          $env:QT_QPA_PLATFORM = 'offscreen'
          foreach ($argument in @('--check-payload', '--smoke-test')) {
            $process = Start-Process -FilePath $exe -ArgumentList $argument -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Windows desktop $argument failed: $($process.ExitCode)" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}-desktop
          path: |
            dist/cytv-macos-*.zip
            dist/cytv-linux-x64.deb
            dist/cytv-windows-x64-desktop.zip
          if-no-files-found: error
