name: cytv standalone builds
on:
  workflow_dispatch:
  push:
    paths:
      - 'cytv/**'
      - 'scripts/build-cytv.py'
      - 'tests/cytv/**'
      - 'launcher/**'
      - 'native/**'
      - 'root-edition/**'
      - 'renewal-service/**'
      - 'lgtv.py'
      - 'release-versions.json'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/cytv.yml'
  pull_request:
    paths:
      - 'cytv/**'
      - 'scripts/build-cytv.py'
      - 'tests/cytv/**'
      - 'launcher/**'
      - 'native/**'
      - 'root-edition/**'
      - 'renewal-service/**'
      - 'lgtv.py'
      - 'release-versions.json'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/cytv.yml'
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: cytv-windows-x64
            binary: dist/cytv.exe
          - os: ubuntu-22.04
            asset: cytv-linux-x64
            binary: dist/cytv
          - os: macos-15
            asset: cytv-macos-arm64
            binary: dist/cytv
          - os: macos-15-intel
            asset: cytv-macos-x64
            binary: dist/cytv
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r cytv/build-requirements.txt
      - run: python -m unittest discover -s tests/cytv -v
      - run: python scripts/build-cytv.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
